<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatBot</title>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-neutral-900 overflow-x-hidden text-white">
    <div class="container mx-auto max-w-3xl pb-44">
      <!-- Meesages  -->
      <!-- User Meesages  -->
      <div class="bg-neutral-700 p-3 rounded-xl my-6 ml-auto max-w-fit">
        Hii, How are You?
      </div>

      <!-- Assitant Meesages  -->
      <div class="max-w-fit">I am good , How are you?</div>
      

      <!-- textarea -->
      <div
        class="fixed bottom-0 inset-x-0 flex items-center justify-center bg-neutral-900"
      >
        <div class="bg-neutral-800 rounded-3xl p-2 w-full max-w-3xl mb-3">
          <textarea
            class="w-full resize-none outline-0 p-3"
            rows="2" id="input"
          ></textarea>
          <div class="flex justify-end items-center">
            <button
              class="bg-white text-black rounded-full cursor-pointer px-4 py-1"
            >
              Ask
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
